name: Verify student tools

on:
  push:
    branches:
      - main
      - feat/student-study-tools
      - feat/study-mood-footer-manual-push
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Study plan tests
        run: npm run test:study-plan
      - name: Study mood tests
        run: npm run test:study-mood
      - name: Subject ordering tests
        run: npm run test:subject-order
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
