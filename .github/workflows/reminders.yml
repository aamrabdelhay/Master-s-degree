name: Exam reminders

# Vercel Hobby cron only runs once a day, so the 24h / 1h exam reminders are
# triggered from here every 5 minutes. Needs repo secret CRON_SECRET (same value
# as the CRON_SECRET env var on Vercel).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is missing"; exit 1; fi
          curl --fail --show-error --silent --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://master-degree-eight.vercel.app/api/cron/reminders
